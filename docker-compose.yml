services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trackmarket-backend
    ports:
      - "5001:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - trackmarket-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trackmarket-frontend
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - trackmarket-network
    restart: unless-stopped

networks:
  trackmarket-network:
    driver: bridge

